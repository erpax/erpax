packages:
  - '.'
  - 'packages/*'

overrides:
  dompurify: latest
  uuid: latest
  esbuild: latest
  ip-address: latest
  '@eslint/plugin-kit': latest
  postcss: latest
  # Advisory remediation, SAME-MAJOR only. A global override crossing a major would
  # silently downgrade a direct dependency — vite is 8.0.10 here and the 6.4.3 the
  # advisory names is a different transitive instance, so the key is range-scoped.
  form-data: ^4.0.6
  ws: ^8.21.0
  js-yaml: ^4.3.0
  hono: ^4.12.34
  immutable: ^4.3.9
  fast-uri: ^3.1.4
  sharp: ^0.35.0
  body-parser: ^2.3.0
  brace-expansion@1: ^1.1.17
  brace-expansion@2: ^2.1.3
  brace-expansion@5: ^5.0.8
  undici@7: ^7.28.0
  vite@8: ^8.0.16
  # Dependabot 2026-08: remaining three vulnerable transitive instances, keys
  # range-scoped to the vulnerable major so no direct dependency moves.
  #   undici@5   (@cursor/sdk → @connectrpc/connect-node) — 8 advisories, patched >=6.27
  #   vite@5     (vitepress 1.x dev server) — fs.deny bypass + NTLM leak, patched >=6.4.3
  #   @hono/node-server@1 (@payloadcms/plugin-mcp → MCP sdk) — serveStatic traversal, patched >=2.0.5
  undici@5: ^6.27.0
  vite@5: ^6.4.3
  '@hono/node-server@1': ^2.0.5
  # Dependabot 2026-08 (GHSA-2v37-7h3g-55p8 nanoid): custom generators can loop indefinitely
  # when size is 0, patched >=3.3.18. Range-scoped to the vulnerable major (the
  # transitive instance is 3.3.16); no direct dependency moves.
  nanoid@3: ^3.3.18

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true
  sqlite3: true
  unrs-resolver: true
  workerd: true

# Suppress upstream peer-range bugs that pnpm 11's stricter checker surfaces.
# Both flagged peers are runtime-compatible — only the peer spec is wrong:
#   - @tailwindcss/typography@0.5.19's peer range only lists v4 prereleases
#     (>=4.0.0-alpha.20 || >=4.0.0-beta.1), missing stable v4.x. The plugin
#     itself works fine with v4 stable; tailwindlabs/tailwindcss#16135.
#   - mcp-handler@1.1.0 pins @modelcontextprotocol/sdk to exactly 1.26.0, but
#     its actual requirement is >=1.26.0 (1.26 was a security fix). 1.27.1+
#     is compatible.
peerDependencyRules:
  allowedVersions:
    '@tailwindcss/typography>tailwindcss': '4'
    'mcp-handler>@modelcontextprotocol/sdk': '1'

patchedDependencies:
  '@payloadcms/drizzle@4.0.0-internal.38b7f1d': patches/@payloadcms__drizzle@4.0.0-internal.38b7f1d.patch
  '@payloadcms/plugin-mcp@4.0.0-internal.38b7f1d': patches/@payloadcms__plugin-mcp@4.0.0-internal.38b7f1d.patch
  image-size@2.0.2: patches/image-size@2.0.2.patch
