packages:
  - '.'
  - 'packages/algebra'

overrides:
  dompurify: latest
  uuid: latest
  esbuild: latest
  ip-address: latest
  '@eslint/plugin-kit': latest
  postcss: latest
  # Advisory remediation, SAME-MAJOR only. A global override crossing a major would
  # silently downgrade a direct dependency — vite is 8.0.10 here and the 6.4.3 the
  # advisory names is a different transitive instance, so the key is range-scoped.
  form-data: ^4.0.6
  ws: ^8.21.0
  js-yaml: ^4.3.0
  hono: ^4.12.27
  immutable: ^4.3.9
  fast-uri: ^3.1.4
  sharp: ^0.35.0
  body-parser: ^2.3.0
  brace-expansion@1: ^1.1.17
  brace-expansion@2: ^2.1.3
  brace-expansion@5: ^5.0.8
  undici@7: ^7.28.0
  vite@8: ^8.0.16

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true
  sqlite3: true
  unrs-resolver: true
  workerd: true

# Suppress upstream peer-range bugs that pnpm 11's stricter checker surfaces.
# Both flagged peers are runtime-compatible — only the peer spec is wrong:
#   - @tailwindcss/typography@0.5.19's peer range only lists v4 prereleases
#     (>=4.0.0-alpha.20 || >=4.0.0-beta.1), missing stable v4.x. The plugin
#     itself works fine with v4 stable; tailwindlabs/tailwindcss#16135.
#   - mcp-handler@1.1.0 pins @modelcontextprotocol/sdk to exactly 1.26.0, but
#     its actual requirement is >=1.26.0 (1.26 was a security fix). 1.27.1+
#     is compatible.
peerDependencyRules:
  allowedVersions:
    '@tailwindcss/typography>tailwindcss': '4'
    'mcp-handler>@modelcontextprotocol/sdk': '1'

patchedDependencies:
  '@payloadcms/drizzle@4.0.0-internal.38b7f1d': patches/@payloadcms__drizzle@4.0.0-internal.38b7f1d.patch
  '@payloadcms/plugin-mcp@4.0.0-internal.38b7f1d': patches/@payloadcms__plugin-mcp@4.0.0-internal.38b7f1d.patch
