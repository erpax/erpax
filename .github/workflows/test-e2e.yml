# Local UI E2E (Playwright) — starts `pnpm dev` via playwright webServer.
# Post-deploy smoke lives in cloudflare.yml against the Worker URL.
name: E2E Tests

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-e2e:
    name: Playwright UI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PAYLOAD_SECRET: test-secret-not-for-production-32-characters
      PAYLOAD_DEV_PUSH: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install chromium --with-deps
      - name: UI smoke (local webServer)
        run: pnpm erpax test e2e-smoke
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: public/evidence/
          retention-days: 7
