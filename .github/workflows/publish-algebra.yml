# Publish @erpax/algebra (free core math only)
#
# Publishes packages/algebra — NEVER the private root erpax app.
# Fold magma (→ @/merge) and licensed surfaces are excluded by packages/algebra/build.mjs.
#
# Triggers (tag-only for uniqueness — do NOT also fire on release.published;
# a GitHub Release that creates algebra-v* would double-publish the same version):
#   - push tags algebra-v*
#   - workflow_dispatch (manual; fails if version already on npm)
#
# Auth (prefer trusted publishing / OIDC):
#   1. npmjs.com → @erpax/algebra → Settings → Trusted Publisher
#      GitHub org: erpax  ·  repo: erpax  ·  workflow: publish-algebra.yml
#   2. Optional fallback: repo Actions secret NPM_TOKEN (classic automation token)
#      → NODE_AUTH_TOKEN. Prefer OIDC; long-lived tokens are last resort.
#
# Provenance: publishConfig.provenance + id-token: write.
# Does not touch Cloudflare deploy.

name: Publish algebra

on:
  push:
    tags:
      - 'algebra-v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)

concurrency:
  group: npm-publish-algebra-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: packages/algebra

jobs:
  publish:
    name: Publish @erpax/algebra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      # Trusted publishing needs npm ≥ 11.5.1
      - name: Ensure modern npm
        working-directory: ${{ github.workspace }}
        run: npm install -g npm@latest

      - name: Install (workspace)
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile

      - name: Assert root stays private (no app publish)
        working-directory: ${{ github.workspace }}
        run: |
          node -e "
            const p = require('./package.json')
            if (p.private !== true) { console.error('✖ root package.json must be private'); process.exit(1) }
            if (p.name !== 'erpax') { console.error('✖ unexpected root name'); process.exit(1) }
            console.log('✔ root private — will not publish licensed app')
          "

      # TESTED RELEASE. This workflow published @erpax/algebra — the MIT core-math
      # package other people consume — with NO test and NO gate: checkout, build,
      # assert tag, publish. It would ship red today (the facade split left the
      # barrel using THEOREMS/isClosed/movie/product without importing them, and the
      # host-math ban is failing). A publisher that cannot fail is not a release.
      - name: Test the package being published
        run: pnpm exec vitest run src/algebra --config ./vitest.config.mts

      - name: Math-ban gate — every theorem is algebra, never host Math.*
        run: pnpm exec cross-env NODE_OPTIONS="--no-deprecation --import=tsx/esm" tsx src/algebra/host/index.ts

      - name: Build free core math
        run: pnpm build

      - name: Assert tag matches package version
        if: startsWith(github.ref, 'refs/tags/algebra-v')
        run: |
          TAG="${GITHUB_REF_NAME#algebra-v}"
          PKG="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag algebra-v${TAG} does not match @erpax/algebra version ${PKG}"
            exit 1
          fi

      - name: Fail if version already on npm
        env:
          # Same token as publish — scoped packuments may 404 without auth
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          NAME="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).name")"
          VER="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          export NAME VER
          RAW="$(npm view "$NAME" versions --json 2>/dev/null || echo '[]')"
          echo "$RAW" | node --input-type=module -e '
            let d = "";
            process.stdin.on("data", (c) => (d += c));
            process.stdin.on("end", () => {
              const ver = process.env.VER;
              const name = process.env.NAME;
              let versions = [];
              try {
                const j = JSON.parse(d || "[]");
                if (Array.isArray(j)) versions = j;
                else if (typeof j === "string") versions = [j];
                else if (j && typeof j === "object" && j.error) versions = [];
              } catch {
                versions = [];
              }
              if (versions.includes(ver)) {
                console.error(
                  `✖ ${name}@${ver} already on npm — bump packages/algebra/package.json and tag algebra-v<new>`,
                );
                process.exit(2);
              }
              console.log(`✔ ${name}@${ver} not in registry (${versions.length} known versions)`);
            });
          '

      - name: Publish to npm
        run: |
          set -euo pipefail
          NAME="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).name")"
          VER="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          if ! npm publish --access public; then
            echo "::error::npm publish failed for ${NAME}@${VER}. Unpublished versions stay burned — bump package.json and tag algebra-v<new>."
            exit 1
          fi
          echo "✔ published ${NAME}@${VER}"
        env:
          # Optional classic fallback when trusted publisher is not configured yet
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
