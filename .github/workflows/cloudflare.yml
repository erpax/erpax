# Cloudflare Workers deploy (OpenNext) — minimum wall-clock.
#
# Critical path: secrets gate → install+stub → migrate ∥ playwright cache → lean Next
# (build:next, no typegen) → OpenNext pack → deploy → UI smoke.
#
# Types/importmap stay committed; CI `payload verify-types` is the freshness gate.
# Full 80MB skill emit is local-only (stub here for the 3MB Worker limit).
#
# Secrets: CLOUDFLARE_API_TOKEN · PAYLOAD_SECRET
# Vars:    STAGING_URL (optional — parsed from wrangler deploy output)
name: Cloudflare

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy + UI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      NODE_ENV: production
      PAYLOAD_BUILD_USE_REMOTE_D1: 'true'
    steps:
      - uses: actions/checkout@v4

      # Fail before pnpm install when secrets are missing (saves minutes on every red run).
      - name: Require Cloudflare secrets
        run: |
          missing=
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$PAYLOAD_SECRET" ] || missing="$missing PAYLOAD_SECRET"
          if [ -n "$missing" ]; then
            echo "✖ Missing GitHub Actions secrets:$missing"
            echo "  Repo → Settings → Secrets and variables → Actions"
            echo "  Add CLOUDFLARE_API_TOKEN (Workers edit) + PAYLOAD_SECRET"
            exit 1
          fi

      - name: Setup erpax
        uses: ./.github/actions/setup
        with:
          skill-index: stub
          ripgrep: 'false'

      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-chromium-1.60.0

      # Install browsers before the long OpenNext build (cache hit ≈ free; cold overlaps migrate).
      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium --with-deps

      - name: Ensure Playwright Chromium (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install chromium

      - name: Migrate remote D1
        run: pnpm erpax deploy db

      - name: Build + deploy (OpenNext → Workers, lean next build)
        id: deploy
        run: |
          set -o pipefail
          pnpm erpax deploy app 2>&1 | tee /tmp/cf-deploy.log
          if [ -n "${{ vars.STAGING_URL }}" ]; then
            BASE="${{ vars.STAGING_URL }}"
          else
            BASE="$(grep -oE 'https://[a-zA-Z0-9._/-]+\.(workers\.dev|erpax\.[a-z]+)' /tmp/cf-deploy.log | head -1 || true)"
          fi
          if [ -z "$BASE" ]; then
            echo "No staging URL resolved — set vars.STAGING_URL" >&2
            exit 1
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "UI smoke target: $BASE"

      - name: UI smoke against deployed Worker
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.base }}
          SKIP_E2E_WEBSERVER: '1'
        run: pnpm erpax test e2e-smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-ui-smoke
          path: public/evidence/
          retention-days: 7
