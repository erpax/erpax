# Cloudflare Workers deploy (OpenNext) — one path: stub → migrate → deploy → UI smoke.
#
# Replaces Deploy to Staging + Next.js Pages sample. Skill index is STUBBED so CI
# fits the 3MB Worker limit and the 5‑min CLI timeout (full 80MB emit is local-only).
#
# Secrets: CLOUDFLARE_API_TOKEN · PAYLOAD_SECRET
# Vars:    STAGING_URL (optional — auto-detected from wrangler deploy output)
name: Cloudflare

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy + UI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      NODE_ENV: production
      PAYLOAD_BUILD_USE_REMOTE_D1: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup erpax
        uses: ./.github/actions/setup
        with:
          skill-index: stub

      - name: Migrate remote D1
        run: pnpm erpax deploy db

      - name: Build + deploy (OpenNext → Workers)
        id: deploy
        run: |
          set -o pipefail
          pnpm erpax deploy app 2>&1 | tee /tmp/cf-deploy.log
          if [ -n "${{ vars.STAGING_URL }}" ]; then
            BASE="${{ vars.STAGING_URL }}"
          else
            BASE="$(grep -oE 'https://[a-zA-Z0-9._/-]+\.(workers\.dev|erpax\.[a-z]+)' /tmp/cf-deploy.log | head -1 || true)"
          fi
          if [ -z "$BASE" ]; then
            echo "No staging URL resolved — set vars.STAGING_URL" >&2
            exit 1
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "UI smoke target: $BASE"

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: UI smoke against deployed Worker
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.base }}
          SKIP_E2E_WEBSERVER: '1'
        run: pnpm erpax test e2e-smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-ui-smoke
          path: public/evidence/
          retention-days: 7
