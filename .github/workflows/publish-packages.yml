# THE publish lane — one workflow, three kinds of release, routed by the tag.
#
#   v*            → the CORPUS release. Cuts the GitHub Release that Zenodo archives
#                   and mints a citable DOI from (.zenodo.json · CITATION.cff).
#   algebra-v*    → @erpax/algebra — the core math.
#   <leaf>-v*     → @erpax/<leaf> for erpax · access · accounting · cloudflare · commerce · identity.
#
# `erpax-v*` publishes @erpax/erpax, the ORIENTATION face — the wire, not the app. It is a
# built package like any other; the root stays private and assert-root-private enforces it.
#
# THE FILENAME IS LOAD-BEARING. npm trusted publishing (OIDC) is configured per package
# against a WORKFLOW FILE, not a workflow name — npmjs.com → @erpax/<pkg> → Settings →
# Trusted Publisher → org erpax · repo erpax · workflow publish-packages.yml. Renaming
# this file silently breaks OIDC publishing for every package pinned to it, so the name
# stays even though the lane now does more than packages.
#   ⚠ ONE SETTING TO UPDATE: @erpax/algebra was pinned to publish-algebra.yml, which this
#     workflow absorbs. Repoint its trusted publisher to publish-packages.yml.
#
# Zenodo: enable the GitHub↔Zenodo integration for erpax/erpax once (zenodo.org → GitHub →
# flip erpax/erpax ON). Every Release created here is then archived with a versioned DOI
# plus a concept DOI that always resolves to the newest version. No code, no token here.
#
# Cut a release:
#   node packages/release.mjs --write        # the @erpax/* packages, by built content
#   node scripts/release-corpus.mjs --write  # the corpus itself, by tracked content
#   git commit -am 'release: v<version>' && git push
#   git tag accounting-v2.1.0 && git push origin accounting-v2.1.0
#   git tag v1.1.0            && git push origin v1.1.0     # corpus + DOI
#
# Neither bump is a judgement call: a release happens when the CONTENT changed, and the
# scripts refuse to invent one when it did not.
#
# A tag is the human in the loop: nothing here fires on a plain push to main.
name: Publish

on:
  push:
    tags:
      - 'v*'
      - 'algebra-v*'
      - 'erpax-v*'
      - 'access-v*'
      - 'accounting-v*'
      - 'cloudflare-v*'
      - 'commerce-v*'
      - 'identity-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (v1.1.0 · algebra-v0.1.2 · accounting-v2.0.0)'
        required: true

permissions:
  contents: write # create the Release — the object the Zenodo webhook fires on
  id-token: write # npm trusted publishing (OIDC)

concurrency:
  group: publish-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}


jobs:
  # Which release is this? Computed from the tag, once, so no job re-derives it.
  route:
    name: Route the tag
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.r.outputs.kind }}
      dir: ${{ steps.r.outputs.dir }}
    steps:
      - id: r
        run: |
          set -euo pipefail
          case "$TAG" in
            algebra-v*)                                          KIND=algebra; DIR=packages/algebra ;;
            erpax-v*|access-v*|accounting-v*|cloudflare-v*|commerce-v*|identity-v*)
                                                                 KIND=package; DIR="packages/${TAG%%-v*}" ;;
            v*)                                                  KIND=corpus;  DIR=. ;;
            *) echo "::error::tag '$TAG' matches no release kind"; exit 1 ;;
          esac
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "dir=$DIR"   >> "$GITHUB_OUTPUT"
          echo "✔ $TAG → $KIND ($DIR)"

  # The corpus itself — the artifact a citation points at.
  corpus:
    name: Corpus release (Zenodo DOI)
    needs: route
    if: needs.route.outputs.kind == 'corpus'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.inputs.tag || github.ref }}', fetch-depth: 0 }

      # A DOI cannot be recalled, only superseded — so the citation metadata is checked
      # BEFORE the Release object exists, never after.
      - name: Citation gate — .zenodo.json ⊗ CITATION.cff ⊗ package.json agree
        run: node scripts/citation-consistent.mjs
      - name: Tag names the version it releases
        run: node scripts/assert-tag-version.mjs "$TAG" .
      # The version is the corpus's CONTENT ADDRESS: released.json must address the tree
      # being tagged. A DOI is permanent, so a version that resolves to different content
      # than it claims is the one failure that cannot be taken back.
      - name: Content gate — released.json addresses this corpus
        run: node scripts/release-corpus.mjs --check

      - uses: ./.github/actions/setup
        with: { skill-index: none, ripgrep: 'false' }

      - name: Self-contained gate — every imported atom is tracked
        run: node scripts/ensure-tracked-imports.mjs
      # No secret: the probe declares its phase and the config tolerates it, because
      # assembling a config touches nothing cryptographic. A gate must not depend on a
      # credential it never uses.
      - name: Boot gate — the Payload config loads
        run: pnpm exec cross-env NODE_OPTIONS="--no-deprecation --import=tsx/esm" tsx src/run/load/index.ts

      - name: Create GitHub Release (fires the Zenodo DOI webhook)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          generate_release_notes: true
          files: |
            CITATION.cff
            .zenodo.json

  # @erpax/algebra — the core math. Fold magma and every licensed surface are excluded
  # by packages/algebra/build.mjs; this lane only proves and ships what is free.
  algebra:
    name: Publish @erpax/algebra
    needs: route
    if: needs.route.outputs.kind == 'algebra'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.inputs.tag || github.ref }}' }
      - uses: ./.github/actions/setup
        with: { skill-index: none, ripgrep: 'false', registry-url: 'https://registry.npmjs.org', npm-latest: 'true' }

      - name: Assert root stays private
        run: node scripts/assert-root-private.mjs

      # A TESTED release. This package shipped for a while with no test and no gate —
      # checkout, build, assert tag, publish. A publisher that cannot fail is not a release.
      - name: Test the package being published
        run: pnpm exec vitest run src/algebra --config ./vitest.config.mts
      - name: Math-ban gate — every theorem is algebra, never host Math.*
        run: pnpm exec cross-env NODE_OPTIONS="--no-deprecation --import=tsx/esm" tsx src/algebra/host/index.ts
      - name: Build free core math
        working-directory: packages/algebra
        run: pnpm build

      - name: Tag names the version it releases
        run: node scripts/assert-tag-version.mjs "$TAG" packages/algebra
      - name: Version is not already burned on npm
        run: node scripts/assert-version-unpublished.mjs packages/algebra
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # scoped packuments may 404 without auth

      - name: Publish to npm
        working-directory: packages/algebra
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # fallback only; prefer trusted publisher

  # The split @erpax/* providers. Versioning is CONTENT-ADDRESSED (packages/release.mjs):
  # a package releases only when its BUILT content-uuid changed.
  package:
    name: Publish @erpax package
    needs: route
    if: needs.route.outputs.kind == 'package'
    runs-on: ubuntu-latest
    env:
      DIR: ${{ needs.route.outputs.dir }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.inputs.tag || github.ref }}' }
      - uses: ./.github/actions/setup
        with: { skill-index: none, ripgrep: 'false', registry-url: 'https://registry.npmjs.org', npm-latest: 'true' }

      - name: Assert root stays private
        run: node scripts/assert-root-private.mjs
      # A committed file importing an atom that never got `git add`ed builds on the
      # author's disk and dies here with ERR_MODULE_NOT_FOUND — how the Cloudflare
      # production build broke. Catch it before the build burns, not after.
      - name: Self-contained gate — every imported atom is tracked
        run: node scripts/ensure-tracked-imports.mjs
      - name: Compliance gate — folder law + content-manifest in sync
        run: |
          node packages/build.mjs all
          node packages/release.mjs --check

      # A package that BUILDS is not a package that WORKS. @erpax/algebra shipped a dist that threw
      # ERR_MODULE_NOT_FOUND on the first line a consumer could write — an extensionless relative
      # import Node ESM will not resolve — and every gate here was green, because every test in this
      # repo imports the SOURCE. This packs each package, installs the tarballs into an empty
      # project, and imports them: the thing a stranger does, done before they do it.
      - name: Consumable gate — every package installs and imports from a clean project
        run: node scripts/packages-consumable.mjs

      # A package that builds but whose Payload config cannot BOOT is not stable — a
      # corpus that cannot load has no other properties.
      #
      # HONEST BOUNDARY: this proves the config BOOTS, not that the payload.config.*
      # suites pass — they are blocked by the locality regression of the dissolution
      # campaign. Boot is what this gate can honestly certify today.
      - name: Boot gate — the Payload config loads
        run: pnpm exec cross-env NODE_OPTIONS="--no-deprecation --import=tsx/esm" tsx src/run/load/index.ts

      # The twelve external rails erpax codes against, checked OFFLINE against frozen
      # captures — deliberately the half that cannot flake: it imports only the *Offline
      # functions, so a release can never be failed by an authority rebooting.
      #
      # HONEST BOUNDARY: green means erpax's parsers agree with CAPTURES, never that an
      # authority is up or still sending that shape.
      - name: Contract gate — erpax parses what the external rails send
        run: pnpm exec cross-env NODE_OPTIONS="--no-deprecation --import=tsx/esm" tsx src/outward/gate/index.ts

      - name: Tag names the version it releases
        run: node scripts/assert-tag-version.mjs "$TAG" "$DIR"
      - name: Version is not already burned on npm
        run: node scripts/assert-version-unpublished.mjs "$DIR"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm (provider publishes itself via OIDC)
        working-directory: ${{ needs.route.outputs.dir }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # fallback only; prefer trusted publisher

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          generate_release_notes: true
