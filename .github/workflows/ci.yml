# Lint · typecheck · tests · Playwright UI · Lean proofs · migrations · Worker · production build — a Payload app's checks, and the kernel's.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    name: Standards banner check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify every standards tag has a value
        run: bash scripts/standards-citation-index.sh --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    env:
      PAYLOAD_SECRET: test-secret-not-for-production-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      PAYLOAD_SECRET: test-secret-not-for-production-32-characters
      # The database is the one the migrations build (./.github/actions/database), restored by content
      # key: no shard pushes a schema from the config (94s each), and vitest.setup.ts does not migrate again.
      PAYLOAD_TEST_SKIP_MIGRATE: '1'
      PAYLOAD_DEV_PUSH: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/database
      - run: pnpm test --shard ${{ matrix.shard }}/4

  test-e2e:
    name: Playwright UI
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PAYLOAD_SECRET: test-secret-not-for-production-32-characters
      # the dev server runs on the migrations' database (restored below) instead of pushing a schema
      PAYLOAD_DEV_PUSH: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/database
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm test:e2e tests/e2e/smoke.e2e.spec.ts
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lean:
    name: Lean proofs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # A verdict is reused, not recomputed: when the proofs, the toolchain and the checker are ones a
      # run already accepted, the kernel answers the same. The key is their content.
      - id: verdict
        uses: actions/cache/restore@v4
        with:
          path: .verdict/lean
          key: lean-${{ hashFiles('src/utilities/verify/lean/**', 'lean-toolchain', 'src/utilities/verify/inventory/index.ts') }}
      - if: steps.verdict.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup
      - name: Install Lean (the version in lean-toolchain)
        if: steps.verdict.outputs.cache-hit != 'true'
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # The kernel must accept every file in src/utilities/verify/lean with no sorry, the committed
      # inventory must be what it reports, and no theorem may rest on an axiom it did not rest on in
      # main's record (new theorems are axiom-free; existing axiom debt may only shrink).
      - if: steps.verdict.outputs.cache-hit != 'true'
        run: |
          git fetch --depth=1 origin main
          git show origin/main:src/utilities/verify/lean/inventory.generated.json > "$RUNNER_TEMP/base-inventory.json"
          ./node_modules/.bin/tsx src/utilities/verify/inventory/index.ts --check --base "$RUNNER_TEMP/base-inventory.json"
          mkdir -p .verdict && echo "accepted at ${{ github.sha }}" > .verdict/lean
      - if: steps.verdict.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .verdict/lean
          key: ${{ steps.verdict.outputs.cache-primary-key }}

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAYLOAD_SECRET: test-secret-not-for-production-32-characters
      PAYLOAD_DEV_PUSH: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The history builds a database from empty (a local D1): the database action does it once per
      # content of src/migrations and reuses that build after. The schema has no change it does not
      # migrate: migrate:create --skip-empty must write nothing, checked on every run.
      - uses: ./.github/actions/database
      - run: |
          pnpm -s payload:migrate:create drift --skip-empty
          if [ -n "$(git status --porcelain src/migrations)" ]; then
            git status --porcelain src/migrations
            echo "::error::the schema has a change no migration covers — run pnpm payload:migrate:create"
            exit 1
          fi

  worker:
    name: Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAYLOAD_SECRET: test-secret-not-for-production-32-characters
      PAYLOAD_DEV_PUSH: 'false'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The Worker Cloudflare would deploy, built and served here: OpenNext builds it, wrangler serves it
      # on a local D1 migrated from the baseline (--local: no remote binding, no credentials). Then CI
      # is a thin MCP client of it (scripts/smoke.mjs): it becomes the first user through Payload's
      # REST auth, enables its API key, and talks to /api/mcp as an agent does — tools/list, a read, and
      # a failed call whose gap the afterToolCall hook must record. `next build` alone passed a Worker
      # that threw on every request; a 401 for a caller without a key passed a gateway that failed every
      # caller with one.
      - uses: ./.github/actions/database
      # Next's own build cache (OpenNext builds with webpack), keyed by the sources: an unchanged tree
      # rebuilds from it, a changed one starts from the latest cache and recompiles what moved.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-webpack-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: next-webpack-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: ./node_modules/.bin/opennextjs-cloudflare build
      - name: Serve the built Worker and smoke it
        run: |
          # wrangler hands a Worker its secrets from .dev.vars, not from the job's environment
          printf 'PAYLOAD_SECRET=%s\n' "$PAYLOAD_SECRET" > .dev.vars
          # --local-upstream: the Worker sees the host it is served on, not the first route in wrangler.jsonc
          ./node_modules/.bin/wrangler dev --local --port 8787 --local-upstream localhost:8787 > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:8787/ && break; sleep 2; done
          node scripts/smoke.mjs http://localhost:8787 || { tail -80 "$RUNNER_TEMP/wrangler.log"; exit 1; }

  build:
    name: Production build (lean)
    runs-on: ubuntu-latest
    env:
      PAYLOAD_SECRET: test-secret-not-for-production-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-turbopack-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: next-turbopack-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      # pnpm build regenerates Payload's types and import map from the config. A commit that skipped the
      # pre-commit hook (a worktree without an install, --no-verify) carries a stale copy: refuse it.
      # cloudflare-env.d.ts is left out: wrangler types also reads the machine's .dev.vars.
      - name: Payload's generated files match the commit
        run: |
          git diff --exit-code -- src/payload-types.ts 'src/app/(payload)/admin/importMap.js' || {
            echo "::error::src/payload-types.ts or the import map differs from what the config generates — run pnpm generate:types and pnpm generate:importmap, and commit"
            exit 1
          }
