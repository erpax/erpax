# Lint · typecheck · tests · Playwright UI · migrations · Worker · production build — a Payload app's checks, nothing else.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    name: Standards banner check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify every standards tag has a value
        run: bash scripts/standards-citation-index.sh --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    env:
      PAYLOAD_SECRET: test-secret-not-for-production-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      PAYLOAD_SECRET: test-secret-not-for-production-32-characters
      PAYLOAD_TEST_SKIP_MIGRATE: '1'
      PAYLOAD_DEV_PUSH: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test --shard ${{ matrix.shard }}/4

  test-e2e:
    name: Playwright UI
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PAYLOAD_SECRET: test-secret-not-for-production-32-characters
      PAYLOAD_DEV_PUSH: 'true'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm test:e2e tests/e2e/smoke.e2e.spec.ts
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAYLOAD_SECRET: test-secret-not-for-production-32-characters
      PAYLOAD_DEV_PUSH: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The history builds a database from empty (a local D1), and the schema has no change it does
      # not migrate: migrate:create --skip-empty must write nothing.
      - run: pnpm -s payload migrate --force-accept-warning
      - run: |
          pnpm -s payload:migrate:create drift --skip-empty
          if [ -n "$(git status --porcelain src/migrations)" ]; then
            git status --porcelain src/migrations
            echo "::error::the schema has a change no migration covers — run pnpm payload:migrate:create"
            exit 1
          fi

  worker:
    name: Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAYLOAD_SECRET: test-secret-not-for-production-32-characters
      PAYLOAD_DEV_PUSH: 'false'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The Worker Cloudflare would deploy, built and served here: OpenNext builds it, wrangler serves it
      # on a local D1 migrated from the baseline (--local: no remote binding, no credentials), and the
      # same smoke script the Deployed workflow runs against production checks it. `next build` alone
      # passed a Worker that threw on every request.
      - run: pnpm -s payload migrate --force-accept-warning
      - run: ./node_modules/.bin/opennextjs-cloudflare build
      - name: Serve the built Worker and smoke it
        run: |
          ./node_modules/.bin/wrangler dev --local --port 8787 > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8787/ && break; sleep 2; done
          node scripts/smoke.mjs http://127.0.0.1:8787 || { tail -80 "$RUNNER_TEMP/wrangler.log"; exit 1; }

  build:
    name: Production build (lean)
    runs-on: ubuntu-latest
    env:
      PAYLOAD_SECRET: test-secret-not-for-production-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
