# Standards · lint · typecheck · vitest · Playwright UI · lean production build (build:next).
# skills.index is STUBBED (see .github/actions/setup) — full 80MB emit is not CI.
# Typegen/importmap verified in typecheck; OpenNext/CF use the same lean next build.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    name: Standards banner check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify every standards tag has a value
        run: bash scripts/standards-citation-index.sh --check
      - name: Verify src/standards cites @standard or @rfc
        run: bash scripts/standards-citation-index.sh --required
      - name: Generate + verify STANDARDS_INDEX
        run: |
          bash scripts/standards-citation-index.sh --write-index
          bash scripts/standards-citation-index.sh --verify-index

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm erpax lint
      - run: pnpm erpax lint src

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    env:
      PAYLOAD_SECRET: test-secret-not-for-production-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm erpax payload verify-types
      - run: pnpm erpax lint typecheck

  test-int:
    name: Integration Tests
    runs-on: ubuntu-latest
    env:
      PAYLOAD_SECRET: test-secret-not-for-production-32-characters
      PAYLOAD_TEST_SKIP_MIGRATE: '1'
      # Migrations are SKIPPED here and the schema is pushed from the live config instead — the
      # greenfield path vitest.globalsetup.ts exists for. Without this, skip-migrate ⊕ no-push left
      # the integration lane running against a database with NO TABLES: every suite that actually
      # writes died on "no such table: tenants", and the ones that do not write reported green over
      # nothing. Pushed ONCE per job (a sentinel in node_modules/.cache); later batches reuse it.
      PAYLOAD_DEV_PUSH: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # VERIFY BEATS RECOMPUTE. A suite's verdict is a function of its inputs — suite file +
      # parsed import closure + schema surface — so a green verdict seals a receipt addressed
      # by that hash, and while the hash stands the verdict stands (src/gate/receipt).
      #
      # This lane threw that away. `--all` voids the receipts, so every push re-ran all 1,530
      # suites in 128 batches of 12: 56 min, 123 min, and two runs killed at the cap. The
      # receipts were not wrong — they were unreachable, living in node_modules/.cache on a
      # runner that is destroyed every run. The address is portable; the store was not.
      #
      # restore-keys means ANY prior run's receipts restore, so a push that changes three
      # atoms runs the suites in those closures and cites the rest.
      - name: Restore test receipts (the verdicts already proven)
        uses: actions/cache/restore@v4
        with:
          path: node_modules/.cache/erpax/test-receipts.json
          key: erpax-test-receipts-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            erpax-test-receipts-${{ runner.os }}-

      # PUSH cites receipts; a PULL REQUEST runs the full roster.
      #
      # The receipt layer's own honest boundary is DATA: integration suites share one D1, so a
      # suite that runs while its data-producing sibling is cited can go red on rows nobody
      # wrote. That is a false RED — the safe direction, and a red batch names itself — but it
      # is a real cost, so the clean full run stays the arbiter where it decides a merge.
      - name: Test waves (cite what the address already answers)
        if: github.event_name != 'pull_request'
        run: pnpm erpax test waves
      - name: Test waves — full roster (the arbiter)
        if: github.event_name == 'pull_request'
        run: pnpm erpax test waves --all

      # Sealed only on green: the step above fails the job before this runs.
      - name: Seal the receipts this run earned
        uses: actions/cache/save@v4
        with:
          path: node_modules/.cache/erpax/test-receipts.json
          key: erpax-test-receipts-${{ runner.os }}-${{ github.sha }}

  # Local UI E2E — Playwright starts `pnpm dev` via its own webServer. The POST-deploy
  # smoke lives in cloudflare.yml against the real Worker URL.
  #
  # PR-ONLY, deliberately. cloudflare.yml deploys on `workflow_run: CI` and refuses any
  # conclusion but success, so a job added to the push lane becomes a new gate on every
  # deploy. Folding the old test-e2e.yml in here is a file consolidation, not a change of
  # what blocks a release — running this on main is a separate decision, made on purpose.
  test-e2e:
    name: Playwright UI
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PAYLOAD_SECRET: test-secret-not-for-production-32-characters
      PAYLOAD_DEV_PUSH: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install chromium --with-deps
      - name: UI smoke (local webServer)
        run: pnpm erpax test e2e-smoke
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: public/evidence/
          retention-days: 7

  build:
    name: Production build (lean)
    runs-on: ubuntu-latest
    # Types freshness is the typecheck job; CF OpenNext uses the same lean next build.
    needs: [standards, lint, typecheck]
    env:
      PAYLOAD_SECRET: test-secret-not-for-production-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          ripgrep: 'false'
      # Skip typegen/importmap/sitemap — committed + verified above; matches OpenNext buildCommand.
      - run: pnpm build:next
