# Lint · typecheck · tests · Playwright UI · Lean proofs · production build — a Payload app's checks, and the kernel's.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    name: Standards banner check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify every standards tag has a value
        run: bash scripts/standards-citation-index.sh --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    env:
      PAYLOAD_SECRET: test-secret-not-for-production-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      PAYLOAD_SECRET: test-secret-not-for-production-32-characters
      PAYLOAD_TEST_SKIP_MIGRATE: '1'
      PAYLOAD_DEV_PUSH: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test --shard ${{ matrix.shard }}/4

  test-e2e:
    name: Playwright UI
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PAYLOAD_SECRET: test-secret-not-for-production-32-characters
      PAYLOAD_DEV_PUSH: 'true'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm test:e2e tests/e2e/smoke.e2e.spec.ts
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lean:
    name: Lean proofs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install Lean (the version in lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # The kernel must accept every file in src/utilities/verify/lean with no sorry, and the committed
      # inventory must be what it reports.
      - run: ./node_modules/.bin/tsx src/utilities/verify/inventory/index.ts --check

  build:
    name: Production build (lean)
    runs-on: ubuntu-latest
    env:
      PAYLOAD_SECRET: test-secret-not-for-production-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
