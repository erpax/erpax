# Standards · lint · typecheck · vitest · Playwright UI · lean production build (build:next).
# skills.index is STUBBED (see .github/actions/setup) — full 80MB emit is not CI.
# Typegen/importmap verified in typecheck; OpenNext/CF use the same lean next build.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    name: Standards banner check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify every standards tag has a value
        run: bash scripts/standards-citation-index.sh --check
      - name: Verify src/standards cites @standard or @rfc
        run: bash scripts/standards-citation-index.sh --required
      - name: Generate + verify STANDARDS_INDEX
        run: |
          bash scripts/standards-citation-index.sh --write-index
          bash scripts/standards-citation-index.sh --verify-index

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm erpax lint
      - run: pnpm erpax lint src

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    env:
      PAYLOAD_SECRET: test-secret-not-for-production-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm erpax payload verify-types
      - run: pnpm erpax lint typecheck

  test-int:
    name: Integration Tests
    runs-on: ubuntu-latest
    env:
      PAYLOAD_SECRET: test-secret-not-for-production-32-characters
      PAYLOAD_TEST_SKIP_MIGRATE: '1'
      # Migrations are SKIPPED here and the schema is pushed from the live config instead — the
      # greenfield path vitest.globalsetup.ts exists for. Without this, skip-migrate ⊕ no-push left
      # the integration lane running against a database with NO TABLES: every suite that actually
      # writes died on "no such table: tenants", and the ones that do not write reported green over
      # nothing. Pushed ONCE per job (a sentinel in node_modules/.cache); later batches reuse it.
      PAYLOAD_DEV_PUSH: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # waves: receipt-split ≤12-suite batches (self-bounded); --all voids receipts on fresh runners
      - run: pnpm erpax test waves --all

  # Local UI E2E — Playwright starts `pnpm dev` via its own webServer. The POST-deploy
  # smoke lives in cloudflare.yml against the real Worker URL.
  #
  # PR-ONLY, deliberately. cloudflare.yml deploys on `workflow_run: CI` and refuses any
  # conclusion but success, so a job added to the push lane becomes a new gate on every
  # deploy. Folding the old test-e2e.yml in here is a file consolidation, not a change of
  # what blocks a release — running this on main is a separate decision, made on purpose.
  test-e2e:
    name: Playwright UI
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PAYLOAD_SECRET: test-secret-not-for-production-32-characters
      PAYLOAD_DEV_PUSH: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install chromium --with-deps
      - name: UI smoke (local webServer)
        run: pnpm erpax test e2e-smoke
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: public/evidence/
          retention-days: 7

  build:
    name: Production build (lean)
    runs-on: ubuntu-latest
    # Types freshness is the typecheck job; CF OpenNext uses the same lean next build.
    needs: [standards, lint, typecheck]
    env:
      PAYLOAD_SECRET: test-secret-not-for-production-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          ripgrep: 'false'
      # Skip typegen/importmap/sitemap — committed + verified above; matches OpenNext buildCommand.
      - run: pnpm build:next
