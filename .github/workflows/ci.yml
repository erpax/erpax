# Standards · lint · typecheck · vitest · production build.
# skills.index is STUBBED (see .github/actions/setup) — full 80MB emit is not CI.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    name: Standards banner check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify every standards tag has a value
        run: bash scripts/standards-citation-index.sh --check
      - name: Verify src/standards cites @standard or @rfc
        run: bash scripts/standards-citation-index.sh --required
      - name: Generate + verify STANDARDS_INDEX
        run: |
          bash scripts/standards-citation-index.sh --write-index
          bash scripts/standards-citation-index.sh --verify-index

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm erpax lint
      - run: pnpm erpax lint src

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    env:
      PAYLOAD_SECRET: test-secret-not-for-production-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm erpax payload verify-types
      - run: pnpm erpax lint typecheck

  test-int:
    name: Integration Tests
    runs-on: ubuntu-latest
    env:
      PAYLOAD_SECRET: test-secret-not-for-production-32-characters
      PAYLOAD_TEST_SKIP_MIGRATE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm erpax test int

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [standards, lint, typecheck, test-int]
    env:
      PAYLOAD_SECRET: test-secret-not-for-production-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run build
