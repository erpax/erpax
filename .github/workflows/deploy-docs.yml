# VitePress docs → GitHub Pages. Manual only until chunked build lands
# (full corpus OOMs on default 16GB runners).
name: Deploy Docs (GitHub Pages)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-docs
  cancel-in-progress: false

jobs:
  build:
    name: Build VitePress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          skill-index: stub
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build docs
        env:
          ERPAX_DOCS_BASE: /erpax/
          ERPAX_SITE_URL: https://erpax.github.io/erpax
          NODE_OPTIONS: --no-deprecation --max-old-space-size=14336
        run: pnpm exec vitepress build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
