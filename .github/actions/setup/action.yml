name: Setup erpax
description: Node 22 + pnpm install + empty skills.index stub (fits Worker limits; skips 80MB emit). skill-index=none · registry-url · npm-latest serve the publish lane.

inputs:
  skill-index:
    description: 'stub (default, CI/deploy) or full (local research only)'
    required: false
    default: stub
  ripgrep:
    # NOTHING IN THE TREE CALLS `rg` ANY MORE. src/standards/emit was the one consumer and it now
    # walks the tree in-process — which is faster, works in a temp directory, and finds the 5
    # bannered files rg missed. The input stays for a caller that still asks, and defaults off:
    # `apt-get install` cost 9.2s a job and took a shard down when an unrelated Microsoft repo
    # returned 403. A gate must not depend on someone else's package server.
    description: 'Install ripgrep — nothing in the tree needs it; kept for ad-hoc use'
    required: false
    default: 'false'
  registry-url:
    description: 'npm registry to authenticate against (publish jobs only; empty = no registry auth)'
    required: false
    default: ''
  npm-latest:
    description: 'Upgrade npm globally — trusted publishing (OIDC) needs npm >= 11.5.1'
    required: false
    default: 'false'
  cache:
    # A `workflow_run` job runs with repository write scope while checking out the SHA that
    # TRIGGERED it, so a pnpm cache the triggering workflow wrote is untrusted input here — CodeQL
    # `actions/cache-poisoning/poisonable-step` flagged every step of cloudflare.yml for exactly
    # that, 24 alerts, and both Analyze checks are REQUIRED on main. Trusted triggers (push,
    # pull_request, schedule, tag) keep the cache; a workflow_run caller passes 'false' and pays a
    # cold install instead of restoring something an untrusted run could have seeded.
    description: "Restore the pnpm cache — pass 'false' from a workflow_run job"
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
        registry-url: ${{ inputs.registry-url }}

    - name: Ensure modern npm (trusted publishing needs >= 11.5.1)
      if: inputs.npm-latest == 'true'
      shell: bash
      run: npm install -g npm@latest

    - name: Install ripgrep
      if: inputs.ripgrep == 'true'
      shell: bash
      run: |
        if ! command -v rg >/dev/null 2>&1; then
          sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
        fi

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # The STUB is 265 fixed bytes and goes straight at the module that writes them — the erpax CLI
    # boot alone was ~3s on top of the emitter's own [[aura]]/[[navigation]] graph, for a file whose
    # content never varies. 6.3s → ~1s, in every job. The FULL emit keeps the CLI: it is local
    # skill-router research, and its cost is paid once and knowingly.
    - name: Emit skills.index
      if: inputs.skill-index != 'none'
      shell: bash
      run: |
        if [ "${{ inputs.skill-index }}" = "full" ]; then
          pnpm erpax corpus skill
        else
          pnpm exec tsx src/skill/router/build/void/index.ts
        fi
