name: Setup erpax
description: Node 22 + pnpm install + empty skills.index stub (fits Worker limits; skips 80MB emit)

inputs:
  skill-index:
    description: 'stub (default, CI/deploy) or full (local research only)'
    required: false
    default: stub
  ripgrep:
    description: 'Install ripgrep (needed for standards emit / CI; skip on Cloudflare deploy)'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: pnpm

    - name: Install ripgrep
      if: inputs.ripgrep == 'true'
      shell: bash
      run: |
        if ! command -v rg >/dev/null 2>&1; then
          sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
        fi

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Emit skills.index
      shell: bash
      run: |
        if [ "${{ inputs.skill-index }}" = "full" ]; then
          pnpm erpax corpus skill
        else
          pnpm erpax corpus skill-stub
        fi
