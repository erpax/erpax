name: Setup erpax
description: Node 22 + pnpm install

inputs:
  registry-url:
    description: 'npm registry to authenticate against (publish jobs only; empty = no registry auth)'
    required: false
    default: ''
  npm-latest:
    description: 'Upgrade npm globally — trusted publishing (OIDC) needs npm >= 11.5.1'
    required: false
    default: 'false'
  cache:
    description: "Restore the pnpm cache — pass 'false' only from a job that checks out an untrusted SHA"
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
        registry-url: ${{ inputs.registry-url }}

    - name: Ensure modern npm (trusted publishing needs >= 11.5.1)
      if: inputs.npm-latest == 'true'
      shell: bash
      run: npm install -g npm@latest

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
