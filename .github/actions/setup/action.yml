name: Setup erpax
description: Node 22 + pnpm install + empty skills.index stub (fits Worker limits; skips 80MB emit). skill-index=none · registry-url · npm-latest serve the publish lane.

inputs:
  skill-index:
    description: 'stub (default, CI/deploy) or full (local research only)'
    required: false
    default: stub
  ripgrep:
    # DEFAULT-DENY. `sudo apt-get install ripgrep` costs 9.2s in every job that takes the default,
    # and only ONE consumer in the tree needs it: src/standards/emit shells out to `rg`. A lint or
    # a typecheck job never reaches it, so it paid nine seconds a run for a binary it never called.
    # Opt IN where a lane can reach the standards emit.
    description: 'Install ripgrep — ONLY where standards emit can be reached (it shells out to rg)'
    required: false
    default: 'false'
  registry-url:
    description: 'npm registry to authenticate against (publish jobs only; empty = no registry auth)'
    required: false
    default: ''
  npm-latest:
    description: 'Upgrade npm globally — trusted publishing (OIDC) needs npm >= 11.5.1'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}

    - name: Ensure modern npm (trusted publishing needs >= 11.5.1)
      if: inputs.npm-latest == 'true'
      shell: bash
      run: npm install -g npm@latest

    - name: Install ripgrep
      if: inputs.ripgrep == 'true'
      shell: bash
      run: |
        if ! command -v rg >/dev/null 2>&1; then
          sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
        fi

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # The STUB is 265 fixed bytes and goes straight at the module that writes them — the erpax CLI
    # boot alone was ~3s on top of the emitter's own [[aura]]/[[navigation]] graph, for a file whose
    # content never varies. 6.3s → ~1s, in every job. The FULL emit keeps the CLI: it is local
    # skill-router research, and its cost is paid once and knowingly.
    - name: Emit skills.index
      if: inputs.skill-index != 'none'
      shell: bash
      run: |
        if [ "${{ inputs.skill-index }}" = "full" ]; then
          pnpm erpax corpus skill
        else
          pnpm exec tsx src/skill/router/build/stub/index.ts
        fi
